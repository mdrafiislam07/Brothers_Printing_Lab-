  <!-- INTRO (JS ashar age-i dekha jay; Home page er rong, pill, float icon er moto design) -->
  <style>
    #intro{position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;
      padding:24px;text-align:center;font-family:'Hind Siliguri',system-ui,sans-serif;color:#16142b;
      background:linear-gradient(180deg,#f7f4ff 0%,#fff5f6 55%,#fff 100%);
      transition:opacity .55s ease,visibility .55s}
    #intro.out{opacity:0;visibility:hidden}
    body.intro-lock{overflow:hidden}

    .in-orbit{position:relative;width:min(240px,64vw);aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;
      background:radial-gradient(circle at 50% 40%,#fff 0%,rgba(255,255,255,.55) 60%,rgba(236,228,255,.5) 100%);
      border:1px solid rgba(255,255,255,.9);box-shadow:0 30px 80px rgba(120,90,220,.15),inset 0 0 60px rgba(255,255,255,.8);
      animation:in-pop .8s cubic-bezier(.2,.9,.3,1.15) both}
    .in-logo{width:44%;aspect-ratio:1;border-radius:28%;overflow:hidden;background:#fff;
      box-shadow:0 18px 40px rgba(76,63,163,.25);animation:in-float 4s ease-in-out infinite}
    .in-logo img{width:100%;height:100%;object-fit:cover;display:block}
    .in-ico{position:absolute;display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:14px;background:#fff;
      font-size:21px;box-shadow:0 8px 22px rgba(76,63,163,.14);animation:in-float 5s ease-in-out infinite}
    .in-f1{top:8%;left:10%}
    .in-f2{top:12%;right:6%;animation-delay:-1.2s}
    .in-f3{bottom:10%;left:4%;animation-delay:-2.4s}
    .in-f4{bottom:6%;right:12%;animation-delay:-3.6s}

    .in-pill{display:inline-flex;align-items:center;gap:8px;margin-top:30px;border:1px solid #e6e1f5;background:#fff;border-radius:999px;
      padding:6px 14px;font-size:12px;font-weight:700;letter-spacing:.06em;box-shadow:0 2px 10px rgba(76,63,163,.06);animation:in-up .7s .2s both}
    .in-pill i{display:inline-block;width:14px;height:8px;border-radius:99px;background:linear-gradient(90deg,#e5484d 40%,#16142b 40%)}
    .in-name{margin-top:16px;font-family:'Bricolage Grotesque','Hind Siliguri',system-ui,sans-serif;font-weight:800;font-size:clamp(26px,6vw,40px);
      line-height:1.15;letter-spacing:-.5px;background:linear-gradient(90deg,#4c3fa3,#c0457a);-webkit-background-clip:text;background-clip:text;
      color:transparent;animation:in-up .7s .35s both}
    .in-tag{margin-top:10px;font-size:clamp(14px,3.6vw,17px);font-weight:600;color:rgba(22,20,43,.7);animation:in-up .7s .5s both}
    .in-bar{width:min(230px,62vw);height:4px;margin-top:26px;border-radius:9px;background:#eee9fa;overflow:hidden;animation:in-up .7s .6s both}
    .in-bar i{display:block;height:100%;background:linear-gradient(90deg,#4c3fa3,#e5484d);animation:in-fill 1.9s .15s ease-out both}

    @keyframes in-pop{from{opacity:0;transform:scale(.7)}}
    @keyframes in-up{from{opacity:0;transform:translateY(14px)}}
    @keyframes in-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
    @keyframes in-fill{from{width:0}to{width:100%}}
    @media(prefers-reduced-motion:reduce){#intro *{animation:none!important}.in-bar i{width:100%}}
  </style>

  <!-- Intro control: minimum 2 second + site ready hole fade out. Maximum 7 second e jabei. -->
  <script>
  (function(){
    var el=document.getElementById('intro'),done=false,minOk=false,ready=!!window.__appReady,loaded=document.readyState==='complete';
    function hide(){
      if(done||!el)return;done=true;
      el.classList.add('out');document.body.classList.remove('intro-lock');
      setTimeout(function(){el.parentNode&&el.parentNode.removeChild(el)},700);
    }
    function check(){if(minOk&&ready&&loaded)hide()}
    setTimeout(function(){minOk=true;check()},2000);
    window.addEventListener('app:ready',function(){ready=true;check()});
    if(!loaded)window.addEventListener('load',function(){loaded=true;check()});
    setTimeout(hide,7000);
  })();
  </script>
</body>
